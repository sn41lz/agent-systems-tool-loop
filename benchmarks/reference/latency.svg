<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">Sequential versus parallel offline tool-loop latency</title><desc id="desc">Measured synthetic protocol benchmark. Model replies and token counts are scripted; no live inference.</desc><rect width="760" height="350" rx="16" fill="#101827"/><g font-family="system-ui,sans-serif"><text x="28" y="40" fill="#fff" font-size="22" font-weight="700">Less waiting. Same execution contract.</text><text x="28" y="67" fill="#9eacc1" font-size="13">Synthetic incident drill · paired runs · measured wall-clock latency</text><rect x="195" y="105" width="376.33" height="20" rx="5" fill="#65e1c0"/><text x="581.33" y="120" fill="#e5edf7" font-size="13">p50 304.4 ms</text><rect x="195" y="135" width="380.00" height="20" rx="5" fill="#7d9dff"/><text x="585.00" y="150" fill="#e5edf7" font-size="13">p95 307.3 ms</text><text x="28" y="130" fill="#e5edf7" font-size="16">sequential</text><rect x="195" y="210" width="237.56" height="20" rx="5" fill="#65e1c0"/><text x="442.56" y="225" fill="#e5edf7" font-size="13">p50 192.1 ms</text><rect x="195" y="240" width="241.35" height="20" rx="5" fill="#7d9dff"/><text x="446.35" y="255" fill="#e5edf7" font-size="13">p95 195.2 ms</text><text x="28" y="235" fill="#e5edf7" font-size="16">parallel</text><text x="28" y="324" fill="#9eacc1" font-size="13">30 samples/configuration · p50 speedup 1.58× · live model quality unmeasured</text></g></svg>
